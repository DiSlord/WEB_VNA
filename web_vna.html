<!DOCTYPE html>
<html lang="ru">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
 <title>VNA Graph Viewer</title>
 <link rel="stylesheet" href="vna_styles.css">
</head>
<body>
<div class="container">
 <div class="side-panel">
  <div class="bar-column">
   <label>Frequency</label>
   <div class="bar-row"><div class ="flabel">Start:</div><input type="text" id="freqStart" data-field="start"></div>
   <div class="bar-row"><div class ="flabel">Stop:</div><input type="text" id="freqStop"  data-field="stop"></div>
   <div class="bar-row"><div class ="flabel">Center:</div><input type="text" id="freqCenter" data-field="center"></div>
   <div class="bar-row"><div class ="flabel">Span:</div><input type="text" id="freqSpan"  data-field="span"></div>
  </div>
  <div class="bar-column">
   <label>Traces</label>
   <div class="bar-row">
    <button class="trace-btn" id="btnM0" onclick="toggleTrace(0)" oncontextmenu="showSlotMenu(event, 0)">Live</button>
    <button class="trace-btn" id="btnM1" onclick="toggleTrace(1)" oncontextmenu="showSlotMenu(event, 1)">M1</button>
    <button class="trace-btn" id="btnM2" onclick="toggleTrace(2)" oncontextmenu="showSlotMenu(event, 2)">M2</button>
    <button class="trace-btn" id="btnM3" onclick="toggleTrace(3)" oncontextmenu="showSlotMenu(event, 3)">M3</button>
    <button class="trace-btn" id="btnM4" onclick="toggleTrace(4)" oncontextmenu="showSlotMenu(event, 4)">M4</button>
   </div>
  </div>
  <div class="bar-column">
   <label>Markers</label>
   <div class="bar-row">
    <button class="btn-main" onclick="addMarker('freq')" title="Add frequency marker">+ ƒ</button>
    <button class="btn-main" onclick="addMarker('time')" title="Add time marker">+ 🕐</button>
    <button class="btn-main" onclick="changeMarker()" title="Edit active marker">
     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
    </button>
    <button class="btn-main" onclick="removeMarker()" title="Delete active marker">
     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
    </button>
   </div>
   <div class="table-wrapper">
    <table class="table">
      <thead><tr><th style="width: 42px;">№</th><th style="width: 22px;"> </th><th>Value</th></tr></thead>
      <tbody id="markerTable"></tbody>
    </table>
   </div>
  </div>
  <div class="bar-column">
   <button class="btn-main" onclick="loadTestData()">Test data</button>
   <button class="btn-main" onclick="graph.resetView()">Reset scale</button>
  </div>
 </div>
 <div class="main-area">
   <div class="top-bar">
    <div class="bar-row">
     <button id="btn_copy" onclick="copyToClipboard()">📋Copy</button>
     <button id="btnLayout" onclick="showLayoutDropdown(event)" title="Tiling">Tiling ▾</button>
    </div>
    <div class="bar-row"><label>Theme:</label><select id="themeSelect" onchange="changeTheme(this.value)"></select><button onclick="toggleFullscreen()">⛶</button></div>
   </div>
   <div class="graph-container">
    <div class="area-panels" id="areaPanels"></div>
     <canvas id="vnaCanvas"></canvas>
   </div>
  </div>
</div>

<div id="contextMenu" class="context-menu"></div>
<input type="file" id="fileInput" accept=".s1p,.s2p,.snp,.txt" style="display: none;">

<script src="vna-data.js"></script>
<script src="vna-math.js"></script>
<script src="vna-graph.js"></script>
<script>

// =============================
// Html elements
// =============================
const $ = id => document.getElementById(id);
const themeSelect = $('themeSelect');
const contextMenu = $('contextMenu');
const fileInput = $('fileInput');
const markerTable = $('markerTable');
const btnLayout = $('btnLayout');
const areaPanels = $('areaPanels');
const vnaCanvas = $('vnaCanvas');

// =============================
// Themes and screen control
// =============================
const themeNames = ['Dark', 'Light', 'Gruvbox', 'Catppuccin', 'Material', 'Warm Dark', 'Midnight Blue'];
const themes = {

function applyTheme(index) {
  if (index < 0 || index >= themeNames.length) index = 0;
  for (const [prop, values] of Object.entries(themes)) document.documentElement.style.setProperty(prop, values[index]);
  localStorage.setItem('vna-theme', index);
}

function initThemes() {
  themeNames.forEach((name, id) => {
    const o = document.createElement('option');
    o.value = id; o.textContent = name;
    themeSelect.appendChild(o);
  });
  const savedTheme = parseInt(localStorage.getItem('vna-theme')) || 0;
  themeSelect.value = savedTheme;
  applyTheme(savedTheme);
}

function changeTheme(index) {
  applyTheme(parseInt(index));
  graph.redraw();
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => {console.log(`Fullscreen error: ${err.message}`); });
  else document.exitFullscreen();
}

// =============================
// Global variables
// =============================
let vnaData;
let graph;

// =============================
//  Context menu
// =============================
function addMenuItem(menu, innerHTML, action, disabled = false) {
  if (innerHTML === null) return;
  const item = document.createElement('div');
  item.className = 'context-menu-item';
  if (action === 'clear') item.classList.add('danger');
  item.innerHTML = innerHTML;
  item.action = action;
  if (disabled) item.classList.add('disabled');
  menu.appendChild(item);
  return item;
}

function addMenuColumn(menu) {
  const column = document.createElement('div');
  column.className = 'menu-column';
  menu.appendChild(column);
  return column;
}

function prepareContextMenu(e, stayOpen = false) {
  const m = contextMenu;
  m.innerHTML = '';
  if (!e) return m;
  e.stopPropagation();
  if (e.target === m.parent && isContextMenu()) { hideContextMenu(); return null; }
  m.stayOpen = stayOpen;
  m.parent = e.target;
  return m;
}

function showContextMenu() {
  const m = contextMenu;
  const rect = m.parent.getBoundingClientRect();
  m.style.display = 'flex';
  m.style.left = rect.left + 'px';
  m.style.top = (rect.bottom + window.scrollY + 3) + 'px';
}
function hideContextMenu() { contextMenu.style.display = 'none'; }
function isContextMenu() { return contextMenu.style.display !== 'none';}

document.addEventListener('click', (e) => {
  const m = contextMenu;
  if (!m.contains(e.target)) {
    if (isContextMenu()) hideContextMenu();
    return;
  }
  e.stopPropagation();
  const menuItem = e.target.closest('.context-menu-item');
  if (!menuItem || menuItem.classList.contains('disabled') || !menuItem.action) return;
  menuItem.action();
  if (!m.stayOpen) hideContextMenu(); 
});

document.addEventListener('touchstart', (e) => {
  const m = contextMenu;
  if (!m.contains(e.target) && isContextMenu()) hideContextMenu();
}, { passive: true });
// =============================
// Freq inputs
// =============================
const freqInputs = {
  start:  document.getElementById('freqStart'),
  stop:   document.getElementById('freqStop'),
  center: document.getElementById('freqCenter'),
  span:   document.getElementById('freqSpan')
};

function updateFreqInputs() {
  const view = graph.areas[0].viewFreq;
  const start = view.xMin, stop = view.xMax;
  const center = (start + stop) / 2;
  const span = (stop - start);
  const active = document.activeElement;
  if (freqInputs.start  !== active) freqInputs.start.value  = formatFreqValue(start);
  if (freqInputs.stop   !== active) freqInputs.stop.value   = formatFreqValue(stop);
  if (freqInputs.center !== active) freqInputs.center.value = formatFreqValue(center);
  if (freqInputs.span   !== active) freqInputs.span.value   = formatFreqValue(span);
}

const FREQ_MIN = 0;
const FREQ_MAX = 10e9;

function onFreqInputChange(e) {
  const field = e.target.dataset.field;
  const value = getValue(e.target.value);
  if (isNaN(value) || value < 0) { updateFreqInputs(); return; }
  const view = graph.areas[0].view;
  let start = view.xMin, stop = view.xMax;
  const freq = getValue(e.target.value);
  let span = (stop - start) / 2;
  let center = (start + stop) / 2;
  switch (field) {
   case 'start': start = freq; if (stop < start) stop = start; break;
   case 'stop': stop = freq; if (stop < start) start = stop; break;
   case 'center':
    if (span > freq - FREQ_MIN) span = freq - FREQ_MIN;
    if (span > FREQ_MAX - freq) span = FREQ_MAX - freq;
    start = freq - span; stop = freq + span;
    break;
   case 'span':
    span = freq / 2; 
    if (center < FREQ_MIN + span) center = FREQ_MIN + span;
    if (center > FREQ_MAX - span) center = FREQ_MAX - span;
    start = center - span; stop = center + span;
    break;
   case 'cw':
    start = freq; stop = freq;
    break;
   default: return;
  }
  graph.setRange(start, stop);
}

// Подписка на события
Object.values(freqInputs).forEach(input => {
  input.addEventListener('change', onFreqInputChange);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.target.blur(); } });
});

// =============================
// Trace buttons
// =============================
function saveSlot(slot) { graph.copySlot(0, slot); updateTraceButton(slot); }
function clearSlot(slot) { graph.clearSlot(slot); updateTraceButton(slot); }
function resetScale(slot) { graph.resetToRange(slot); }
function exportS1P(slot) { const content = vnaData.exportS1P(slot); if (content) downloadFile(content, slot === 0 ? 'live.s1p' : `m${slot}.s1p`); }
function exportS2P(slot) { const content = vnaData.exportS2P(slot); if (content) downloadFile(content, slot === 0 ? 'live.s2p' : `m${slot}.s2p`); }
function loadSnP(slot) { fileInput.slot = slot; fileInput.value = ''; fileInput.click(); }

// Button context menu
function showSlotMenu(e, slot) {
  e.preventDefault(); // Prevent Right click
  const m = prepareContextMenu(e);
  const col = addMenuColumn(m);
  if (slot === 0) {
    const hasData = vnaData.getSlot(0, 'S11').freqs.length > 0;
    addMenuItem(col, '📏 Set to Live range', () => resetScale(slot), !hasData);
    addMenuItem(col, '💾 Export as S1P...', () => exportS1P(slot), !hasData);
    addMenuItem(col, '💾 Export as S2P...', () => exportS2P(slot), !hasData);
    addMenuItem(col, '📂 Load SnP...', () => loadSnP(slot), false);
  } else {
    const hasData = vnaData.getSlot(slot, 'S11').freqs.length > 0;
    addMenuItem(col, hasData ? '🔄 Resave Live here' : '💾 Save Live here', () => saveSlot(slot), false);
    addMenuItem(col, '🗑️ Clear slot', () => clearSlot(slot), !hasData);
    addMenuItem(col, '📏 Set to this range', () => resetScale(slot), !hasData);
    addMenuItem(col, '💾 Export as S1P...', () => exportS1P(slot), !hasData);
    addMenuItem(col, '💾 Export as S2P...', () => exportS2P(slot), !hasData);
    addMenuItem(col, '📂 Load SnP...', () => loadSnP(slot), false);
  }
  showContextMenu();
}

function toggleTrace(slot) {
  const hasData = vnaData.getSlot(slot, 'S11').freqs.length > 0;
  if (!hasData) return;
  graph.visibility[slot] = !graph.visibility[slot];
  const btn = $('btnM' + slot);
  if (btn) btn.classList.toggle('active', graph.visibility[slot]);
  graph.redraw(true);
}

function updateTraceButton(slot) {
  const btn = $('btnM' + slot);
  if (!btn) return;
  const hasData = vnaData.getSlot(slot, 'S11').freqs.length > 0;
  const isVisible = graph.visibility[slot];
  btn.classList.toggle('has-data', hasData);
  btn.classList.toggle('active', hasData && isVisible);
}

function updateAllTraceButtons() { for (let i = 0; i < 5; i++) updateTraceButton(i); }


// =============================
// File / copy / export
// =============================
function downloadFile(content, filename) {
  const blob = new Blob([content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

async function loadFile(file, slot = 0) {
  if (!file || slot < 0) return;
  const ext = file.name.split('.').pop().toLowerCase();
  const format = ['s1p', 's2p'].find(f => f === ext);
  if (!format) return;
  const buffer = await file.arrayBuffer();
  const text = new TextDecoder().decode(buffer);
  const parsed = vnaData.parseSnP(text);
  if (!parsed || !parsed.freqs || parsed.freqs.length === 0) return;

  vnaData.setSlotData(slot, parsed.freqs, parsed.S11, parsed.S21, parsed.S12, parsed.S22);
  if (slot == 0) graph.resetToRange(slot);
  graph.visibility[slot] = true;
  updateTraceButton(slot);
  graph.redraw(true);
  updateMarkerTable();
}

function loadTestData() {
  const frequencies = [], S11 = [], S21 = [];
  for (let i = 0; i < 10000; i++) {
    const freq = 1e6 + i * 6e6/100;
    frequencies.push(freq);
    const resonance = 100e6, q = 50, detuning = (freq - resonance) / resonance;
    const mag = 1 / Math.sqrt(1 + Math.pow(2 * q * detuning, 2));
    const phase = -Math.atan(2 * q * detuning);
    S11.push({ re: mag * Math.cos(phase), im: mag * Math.sin(phase) });
    const cutoff = 500e6, ratio = freq / cutoff;
    const mag21 = 1 / Math.sqrt(1 + Math.pow(ratio, 4));
    const phase21 = -Math.atan(Math.pow(ratio, 2));
    S21.push({ re: mag21 * Math.cos(phase21), im: mag21 * Math.sin(phase21) });
  }
  vnaData.setSlotData(0, frequencies, S11, S21);
  graph.resetView();
}

// Copy / Download
async function copyToClipboard() {
  const blob = await new Promise(r => vnaCanvas.toBlob(r, 'image/png'));
  await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
}

// =============================
// Markers
// =============================
function addMarker(type) { graph.addMarker(type); }
function removeMarker() { graph.removeSelectedMarker(); }
function changeMarker() {
  const idx = graph.selectedMarkerIndex;
  if (idx < 0 || idx >= graph.markers.length) return;
  const tdFreq = markerTable.querySelectorAll('tr')[idx].cells[2];
  if (!tdFreq || tdFreq.querySelector('form')) return;
  const currentValue = tdFreq.textContent;
  tdFreq.innerHTML = `<form><input type="text" value="${currentValue}"></form>`;
  const form = tdFreq.querySelector('form');
  const input = form.querySelector('input');
  input.focus();
  const match = currentValue.match(/(.*\d)/);
  input.setSelectionRange(0, match ? match[1].length : currentValue.length);
  form.addEventListener('submit', (e) => {e.preventDefault(); graph.setMarkerXVal(idx, getValue(input.value)); });
  input.addEventListener('blur', () => { tdFreq.textContent = currentValue; });
}

function updateMarkerTable() {
  markerTable.innerHTML = '';
  graph.markers.forEach((marker, idx) => {
    const tr = document.createElement('tr');
    if (idx === graph.selectedMarkerIndex) tr.classList.add('selected');
    const icon = marker.type === 'freq' ? 'ƒ' : '🕐';
    const valText = marker.type === 'freq' ? formatFreqValue(marker.xVal) : formatTime(marker.xVal, 6);
    tr.innerHTML = `<td>M${idx + 1}</td><td>${icon}</td><td style="text-align: right">${valText}</td>`;
    tr.addEventListener('click', () => { graph.selectMarker(idx); });
    tr.addEventListener('dblclick', (e) => { changeMarker(idx); });
    markerTable.appendChild(tr);
  });
}

// =============================
// Area panel creation and sync
// =============================
function buildAreaPanels() {
  areaPanels.innerHTML = '';
  graph.areas.forEach((area, areaIdx) => {
    if (!area.visible) return; 
    const panel = document.createElement('div');
    panel.className = 'area-panel';
    panel.area = areaIdx;
    // Позиционируем панель в верхней части region
    const r = area.region;
    panel.style.left = (r.leftPct * 100) + '%';
    panel.style.top = (r.topPct * 100) + '%';
    panel.style.width = ((r.rightPct - r.leftPct) * 100) + '%';

    // Dropdown TRACE_TYPES
    const btnType = document.createElement('button');
    btnType.className = 'trace-type';
    btnType.addEventListener('click', (e) => { showTraceTypeDropdown(e, area); });
    panel.appendChild(btnType);

    // Smith format select
    const btnSmith = document.createElement('button');
    btnSmith.className = 'smith-format';
    btnSmith.addEventListener('click', (e) => { showSmithFormatDropdown(e, area); });
    panel.appendChild(btnSmith);


    const btnTD = document.createElement('button');
    btnTD.textContent = 'TDR';
    btnTD.title = 'Time Domain Transform';
    btnTD.addEventListener('click', (e) => { showTDMenu(e, area); });
    if (area.td.enabled) btnTD.classList.add('active');
    panel.appendChild(btnTD);

    // Channels checkboxes
    ['S11', 'S21', 'S12', 'S22'].forEach(ch => {
      const lbl = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.channel = ch;
      cb.addEventListener('change', () => {
        const chObj = {};
        panel.querySelectorAll('input[type=checkbox]').forEach(c => { chObj[c.channel] = c.checked; });
        area.setChannels(chObj);
        graph.redraw(true);
      });
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(ch));
      panel.appendChild(lbl);
    });

    // Кнопка автомасштаба
    const btnAuto = document.createElement('button');
    btnAuto.textContent = '⇅';
    btnAuto.title = 'Auto scale';
    btnAuto.addEventListener('click', () => { area.autoScale(); graph.redraw(true); });
    panel.appendChild(btnAuto);

    // Кнопка сброса
    const btnReset = document.createElement('button');
    btnReset.textContent = '⇄';
    btnReset.title = 'Reset X';
    btnReset.addEventListener('click', () => { area.resetX(); graph.redraw(true); });
    panel.appendChild(btnReset);

    areaPanels.appendChild(panel);

    updateTraceType(btnType, area);
    updateSmithFormatButton(btnSmith, area);
    updateChannelCheckboxes(panel, area);
  });
}

// Trace type button and menu
function updateTraceType(btn, area) {
  btn.textContent = '▾ ' + TRACE_TYPES[area.trace.type].name;
}

function setTraceType(btn, area, type) {
  area.setTraceType(type);
  updateTraceType(btn, area);
  const panel = btn.closest('.area-panel');
  updateChannelCheckboxes(panel, area);
  updateSmithFormatButton(panel.querySelector('.smith-format'), area);
  graph.redraw(true);
}

function showTraceTypeDropdown(e, area) {
  const m = prepareContextMenu(e), MAX_ROWS = 9;
  if (!m) return;
  const groups = {
    'ALL': Object.keys(TRACE_TYPES).filter(k => TRACE_TYPES[k].valid === CH_ALL),
    'S11/S22': Object.keys(TRACE_TYPES).filter(k => TRACE_TYPES[k].valid === CH_REFLECT),
    'S21/S12': Object.keys(TRACE_TYPES).filter(k => TRACE_TYPES[k].valid === CH_THRU)
  };
  for (const [groupName, types] of Object.entries(groups)) {
    for (let i = 0; i < types.length; i += MAX_ROWS) {
      const chunk = types.slice(i, i + MAX_ROWS);
      const col = addMenuColumn(m);
      addMenuItem(col, i == 0 ? groupName : ' ', null, true);
      chunk.forEach(typeKey => addMenuItem(col, TRACE_TYPES[typeKey].name, () => setTraceType(m.parent, area, typeKey)));
    }
  }
  showContextMenu();
}

// Smith format button and menu
function updateSmithFormatButton(btn, area) {
  if (!area.rad) { btn.style.display = 'none'; return; }
  btn.style.display = '';
  btn.textContent = '▾ ' + MARKER_INFO[area.trace.smithFormat].name;
}

function setSmithFormat(parent, area, format) {
  area.setSmithFormat(format);
  updateSmithFormatButton(parent, area);
  graph.redraw(true);
}

function showSmithFormatDropdown(e, area) {
  const m = prepareContextMenu(e);
  if (!m) return;
  const col = addMenuColumn(m);
  for (const [format, info] of Object.entries(MARKER_INFO)) {
    if (info.valid & area.trace.channels) {
      const check = (format === area.trace.smithFormat) ? '✓ ' : '   ';
      addMenuItem(col, `${check}${info.name}`, () => setSmithFormat(m.parent, area, format));
    }
  }
  showContextMenu();
}

// Channel checkboxes
function updateChannelCheckboxes(panel, area) {
  const typeDef = TRACE_TYPES[area.trace.type];
  const mask = area.trace.channels;
  panel.querySelectorAll('input[type=checkbox]').forEach(cb => {
    const ch = cb.channel;
    const chBit = ch === 'S11' ? CH_S11 : ch === 'S21' ? CH_S21 : ch === 'S12' ? CH_S12 : CH_S22;
    cb.disabled = typeDef ? !(typeDef.valid & chBit) : false;
    cb.checked = !!(mask & chBit);
  });
}

function showTDMenu(e, area) {
  const m = prepareContextMenu(e, true);
  if (!m) return;
  // === Колонка 1: Mode + Window ===
  const col1 = addMenuColumn(m);
  addMenuItem(col1, 'Mode:', null, true);
  const modes = [
    { key: 'bandpass', name: 'Bandpass' },
    { key: 'lowpass_step', name: 'Lowpass Step' },
    { key: 'lowpass_impulse', name: 'Lowpass Impulse' }
  ];
  modes.forEach(({ key, name }) => {
    const check = area.td.mode === key ? '✓' : '   ';
    addMenuItem(col1, `${check} ${name}`, () => {
      area.setTD({ mode: key });
      graph.redraw(true);
      showTDMenu(null, area);
    });
  });

  addMenuItem(col1, 'Window:', null, true);
  const windows = ['minimum', 'normal', 'maximum'];
  windows.forEach(win => {
    const check = area.td.window === win ? '✓' : '   ';
    const displayName = win[0].toUpperCase() + win.slice(1);
    addMenuItem(col1, `${check} ${displayName}`, () => {
      area.setTD({ window: win });
      graph.redraw(true);
      showTDMenu(null, area);
    });
  });
  
  // === Колонка 2: Velocity Factor + X-Axis + Enable ===
  const col2 = addMenuColumn(m);
  // Enable TD toggle
  const enableCheck = area.td.enabled ? '✓' : '   ';
  addMenuItem(col2, `${enableCheck} Enable TDR`, () => {
    area.setTD({ enabled: !area.td.enabled });
    m.parent.classList.toggle('active', area.td.enabled);
    graph.redraw(true);
    showTDMenu(null, area);
  });

  addMenuItem(col2, 'X-Axis:', null, true);
  const axisModes = [
    { key: 'time', name: 'Time (s)' },
    { key: 'distance', name: 'Distance (m)' }
  ];
  
  axisModes.forEach(({ key, name }) => {
    const check = area.td.xAxisMode === key ? '✓' : '   ';
    addMenuItem(col2, `${check} ${name}`, () => {
      area.setTD({ xAxisMode: key });
      graph.redraw(true);
      showTDMenu(null, area);
    });
  });

  addMenuItem(col2, ' ', null, true);
  // Velocity Factor — input
  const html = `Velocity:  <input type="text" class="velocity" value="${graph.velocityFactor}">`;
  const vfInput = addMenuItem(col2, html, null).querySelector('input');

  vfInput.addEventListener('change', () => {
    graph.setVelocityFactor(parseFloat(vfInput.value.replace(',', '.')));
    vfInput.value = graph.velocityFactor;
  });
  vfInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      vfInput.blur();
    }
    e.stopPropagation();
  });

  showContextMenu();
}

// =============================
// Select areas on canvas configuration
// =============================
const LAYOUT_PRESETS = [
  { name: '1', r: [[0, 0, 1, 1]] },
  { name: '2', r: [[0, 0, 0.5, 1], [0.5, 0, 1, 1]] },
  { name: '2', r: [[0, 0, 1, 0.5], [0, 0.5, 1, 1]] },
  { name: '3', r: [[0, 0, 0.5, 0.5], [0.5, 0, 1, 0.5], [0, 0.5, 1, 1]] },
  { name: '3', r: [[0, 0, 0.5, 1], [0.5, 0, 1, 0.5], [0.5, 0.5, 1, 1]] },
  { name: '3', r: [[0, 0, 0.5, 0.5], [0, 0.5, 0.5, 1], [0.5, 0, 1, 1]] },
  { name: '3', r: [[0, 0, 1, 0.333], [0, 0.333, 1, 0.666], [0, 0.666, 1, 1]] },
  { name: '4', r: [[0, 0, 0.5, 0.5], [0.5, 0, 1, 0.5], [0, 0.5, 0.5, 1], [0.5, 0.5, 1, 1]] },
  { name: '4', r: [[0, 0, 0.333, 0.5], [0.333, 0, 0.666, 0.5], [0.666, 0, 1, 0.5], [0, 0.5, 1, 1]] }
];

// Generate icons depend from regions
LAYOUT_PRESETS.forEach(p => { p.icon = generateLayoutIcon(p.r); });
function generateLayoutIcon(r, width = 13, height = 12, gap = 1) {
  const rects = r.map(([l, t, r, b]) => {
    const x = Math.floor(l * width + gap / 2 + 0.5), y = Math.floor(t * width + gap / 2 + 0.5);
    const w = Math.floor((r - l) * height - gap + 0.5), h = Math.floor((b - t) * height - gap + 0.5);
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" fill="currentColor">${rects}</svg>`;
}

function updateLayoutButtonText(id) {
  btnLayout.layoutId = id;
  const l = LAYOUT_PRESETS[id];
  btnLayout.innerHTML = `${l.r.length}: ${l.icon} ▾`;
}

function showLayoutDropdown(e) {
  const m = prepareContextMenu(e);
  if (!m) return;
  const col = addMenuColumn(m);
  LAYOUT_PRESETS.forEach((l, id) => {
    const check = id == btnLayout.layoutId ? '✓' : '   ';
    addMenuItem(col, `${check} ${l.r.length}: ${l.icon}`, () => { changeLayout(id); });
  });
  showContextMenu();
}

function changeLayout(layoutId) {
  const r = LAYOUT_PRESETS[layoutId]?.r;
  if (!r) return;
  localStorage.setItem('vna-layout', layoutId);
  graph.setRegions(r.map(([l, t, ri, b]) => ({ leftPct: l, topPct: t, rightPct: ri, bottomPct: b })));
  buildAreaPanels();
  updateLayoutButtonText(layoutId);
}

function initLayouts() {
  const id = localStorage.getItem('vna-layout') || 0;
  updateLayoutButtonText(id);
  changeLayout(id);
}

// =============================
//  Инициализация
// =============================
async function main() {
  // Web UI
  initThemes();
  hideContextMenu();

  // Data and renders
  vnaData = new VNAData(5);
  await vnaData.init();
  graph = new VNAGraph('vnaCanvas', vnaData);

  // 3. Данные и отрисовка
  initLayouts();
  updateFreqInputs();
  updateAllTraceButtons();
  updateMarkerTable();

  // 4. События
  // File load and Drag & drop support
  fileInput.addEventListener('change', async e => {loadFile(e.target.files[0], e.target.slot);});
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', async e => {e.preventDefault(); loadFile(e.dataTransfer.files[0], 0);});
  
  //  Block events if menu open
  ['mousemove', 'mousedown', 'wheel', 'dblclick'].forEach(evt => contextMenu.addEventListener(evt, e => e.stopPropagation()));
}

document.addEventListener('DOMContentLoaded', main);

</script>
