<!DOCTYPE html>
<html lang="ru">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
 <title>VNA Graph Viewer</title>
 <link rel="stylesheet" href="vna_styles.css">
</head>
<body>
<div class="container">
 <div class="side-panel">
  <div class="bar-column">
   <label>Frequency</label>
   <div class="bar-row"><div class ="flabel">Start:</div><input type="text" id="freqStart" data-field="start"></div>
   <div class="bar-row"><div class ="flabel">Stop:</div><input type="text" id="freqStop"  data-field="stop"></div>
   <div class="bar-row"><div class ="flabel">Center:</div><input type="text" id="freqCenter" data-field="center"></div>
   <div class="bar-row"><div class ="flabel">Span:</div><input type="text" id="freqSpan"  data-field="span"></div>
  </div>
  <div class="bar-column">
   <label>Traces</label>
   <div class="bar-row">
    <button class="trace-btn" id="btnM0" onclick="toggleTrace(0)" oncontextmenu="showContextMenu(event, 0)">Live</button>
    <button class="trace-btn" id="btnM1" onclick="toggleTrace(1)" oncontextmenu="showContextMenu(event, 1)">M1</button>
    <button class="trace-btn" id="btnM2" onclick="toggleTrace(2)" oncontextmenu="showContextMenu(event, 2)">M2</button>
    <button class="trace-btn" id="btnM3" onclick="toggleTrace(3)" oncontextmenu="showContextMenu(event, 3)">M3</button>
    <button class="trace-btn" id="btnM4" onclick="toggleTrace(4)" oncontextmenu="showContextMenu(event, 4)">M4</button>
   </div>
  </div>
  <div class="bar-column">
   <label>Markers</label>
   <div class="bar-row">
    <button class="btn-main" onclick="addMarker()">
     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
    <button class="btn-main" onclick="changeMarker()" id="btnEdit">
     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
    </button>
    <button class="btn-main" onclick="removeMarker()" id="btnDelete">
     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
    </button>
   </div>
   <div class="table-wrapper">
    <table class="table">
      <thead><tr><th style="width: 40px;">№</th><th>Frequency</th></tr></thead>
      <tbody id="markerTable"></tbody>
    </table>
   </div>
  </div>
  <div class="bar-column">
   <button class="btn-main" onclick="loadTestData()">Test data</button>
   <button class="btn-main" onclick="graph.resetView()">Reset scale</button>
  </div>
 </div>
 <div class="main-area">
   <div class="top-bar">
    <div class="bar-row">
     <button id="btn_copy" onclick="copyToClipboard()">📋Copy</button>
     <label>Tiling:</label><select id="layoutSelect" onchange="changeLayout(this.value)"></select>
    </div>
    <div class="bar-row"><label>Theme:</label><select id="themeSelect" onchange="changeTheme(this.value)"></select><button onclick="toggleFullscreen()">⛶</button></div>
   </div>
   <div class="graph-container">
    <div class="area-panels" id="areaPanels"></div>
     <canvas id="vnaCanvas"></canvas>
   </div>
  </div>
</div>

<div id="contextMenu" class="context-menu"></div>
<input type="file" id="fileInput" accept=".s1p,.s2p,.snp,.txt" style="display: none;">

<script src="vna-data.js"></script>
<script src="vna-math.js"></script>
<script src="vna-graph.js"></script>
<script>

// =============================

const themeSelect = $('themeSelect');
const contextMenu = $('contextMenu');
const fileInput = $('fileInput');
const markerTable = $('markerTable');
const layoutSelect = $('layoutSelect');
const areaPanels = $('areaPanels');
const vnaCanvas = $('vnaCanvas');

function applyTheme(index) {
  if (index < 0 || index >= themeNames.length) index = 0;
  for (const [prop, values] of Object.entries(themes)) document.documentElement.style.setProperty(prop, values[index]);
  localStorage.setItem('vna-theme', index);
}

function initThemes() {
  themeNames.forEach((name, id) => {
    const o = document.createElement('option');
    o.value = id; o.textContent = name;
    themeSelect.appendChild(o);
  });
  const savedTheme = parseInt(localStorage.getItem('vna-theme')) || 0;
  themeSelect.value = savedTheme;
  applyTheme(savedTheme);
}

function changeTheme(index) {
  applyTheme(parseInt(index));
  graph.redraw();
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => {console.log(`Fullscreen error: ${err.message}`); });
  else document.exitFullscreen();
}

// =============================
// Global variables
// =============================
let vnaData;
let graph;

// =============================
//  Context menu
// =============================
function addMenuItem(menu, textContent, action, disabled = false) {
  if (textContent === null) return;
  const item = document.createElement('div');
  item.className = 'context-menu-item';
  if (action === 'clear') item.classList.add('danger');
  item.textContent = textContent;
  item.action = action;
  if (disabled) item.classList.add('disabled');
  menu.appendChild(item);
}

function showContextMenu(e, slot) {
  e.preventDefault(); e.stopPropagation();
  const m = contextMenu;
  m.innerHTML = '';
  m.slot = slot;

  if (slot === 0) {
    const hasData = vnaData.getSlot(0, 'S11').freqs.length > 0;
    addMenuItem(m, '📏 Set to Live range', 'resetScale', !hasData);
    addMenuItem(m, '💾 Export as S1P...', 'exportS1P', !hasData);
    addMenuItem(m, '💾 Export as S2P...', 'exportS2P', !hasData);
    addMenuItem(m, '📂 Load SnP...', 'loadSnP', false);
  } else {
    const hasData = vnaData.getSlot(slot, 'S11').freqs.length > 0;
    addMenuItem(m, hasData ? '🔄 Resave Live here' : '💾 Save Live here', 'save', false);
    addMenuItem(m, '🗑️ Clear slot', 'clear', !hasData);
    addMenuItem(m, '📏 Set to this range', 'resetScale', !hasData);
    addMenuItem(m, '💾 Export as S1P...', 'exportS1P', !hasData);
    addMenuItem(m, '💾 Export as S2P...', 'exportS2P', !hasData);
    addMenuItem(m, '📂 Load SnP...', 'loadSnP', false);
  }
  m.style.display = 'block';
  m.style.left = e.pageX + 'px';
  m.style.top = e.pageY + 'px';
}

function hideContextMenu() {
  contextMenu.style.display = 'none';
}

const contextMenuActions = {
  save: (slot) => {
   if (slot > 0) {
     graph.copySlot(0, slot);
     updateTraceButton(slot);
   }
  },
  clear: (slot) => {
   if (slot > 0) {
    graph.clearSlot(slot);
    updateTraceButton(slot);
   }
  },
  resetScale: (slot) => { graph.resetToRange(slot);},
  exportS1P: (slot) => {
   const content = vnaData.exportS1P(slot);
   if (content) downloadFile(content, slot === 0 ? 'live.s1p' : `m${slot}.s1p`);
  },
  exportS2P: (slot) => {
   const content = vnaData.exportS2P(slot);
   if (content) downloadFile(content, slot === 0 ? 'live.s2p' : `m${slot}.s2p`);
  },
  loadSnP: (slot) => {
   fileInput.slot = slot;
   fileInput.value = '';
   fileInput.click();
  }
};

document.addEventListener('click', (e) => {
  const menu = contextMenu;
  if (!menu || !menu.contains(e.target)) {
    if (menu && menu.style.display === 'block') menu.style.display = 'none';
    return;
  }
  e.stopPropagation();
  const menuItem = e.target.closest('.context-menu-item');
  if (!menuItem || menuItem.classList.contains('disabled')) return;
  const action = menuItem.action;
  if (!action) return;
  const handler = contextMenuActions[action];
  hideContextMenu(); 
  if (handler) handler(+menu.slot);
});

// =============================
// Freq inputs
// =============================
const freqInputs = {
  start:  document.getElementById('freqStart'),
  stop:   document.getElementById('freqStop'),
  center: document.getElementById('freqCenter'),
  span:   document.getElementById('freqSpan')
};

function updateFreqInputs() {
  const view = graph.areas[0].view;
  const start = view.xMin, stop = view.xMax;
  const center = (start + stop) / 2;
  const span = (stop - start);
  const active = document.activeElement;
  if (freqInputs.start  !== active) freqInputs.start.value  = formatFreqValue(start);
  if (freqInputs.stop   !== active) freqInputs.stop.value   = formatFreqValue(stop);
  if (freqInputs.center !== active) freqInputs.center.value = formatFreqValue(center);
  if (freqInputs.span   !== active) freqInputs.span.value   = formatFreqValue(span);
}

const FREQ_MIN = 0;
const FREQ_MAX = 10e9;

function onFreqInputChange(e) {
  const field = e.target.dataset.field;
  const value = getValue(e.target.value);
  if (isNaN(value) || value < 0) { updateFreqInputs(); return; }
  const view = graph.areas[0].view;
  let start = view.xMin, stop = view.xMax;
  const freq = getValue(e.target.value);
  let span = (stop - start) / 2;
  let center = (start + stop) / 2;
  switch (field) {
   case 'start': start = freq; if (stop < start) stop = start; break;
   case 'stop': stop = freq; if (stop < start) start = stop; break;
   case 'center':
    if (span > freq - FREQ_MIN) span = freq - FREQ_MIN;
    if (span > FREQ_MAX - freq) span = FREQ_MAX - freq;
    start = freq - span; stop = freq + span;
    break;
   case 'span':
    span = freq / 2; 
    if (center < FREQ_MIN + span) center = FREQ_MIN + span;
    if (center > FREQ_MAX - span) center = FREQ_MAX - span;
    start = center - span; stop = center + span;
    break;
   case 'cw':
    start = freq; stop = freq;
    break;
   default: return;
  }
  graph.setRange(start, stop);
}

// Подписка на события
Object.values(freqInputs).forEach(input => {
  input.addEventListener('change', onFreqInputChange);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.target.blur(); } });
});

// =============================
// Trace buttons
// =============================
function toggleTrace(slot) {
  const hasData = vnaData.getSlot(slot, 'S11').freqs.length > 0;
  if (!hasData) return;
  graph.visibility[slot] = !graph.visibility[slot];
  const btn = $('btnM' + slot);
  if (btn) btn.classList.toggle('active', graph.visibility[slot]);
  graph.redraw(true);
}

function updateTraceButton(slot) {
  const btn = $('btnM' + slot);
  if (!btn) return;
  const hasData = vnaData.getSlot(slot, 'S11').freqs.length > 0;
  const isVisible = graph.visibility[slot];
  btn.classList.toggle('has-data', hasData);
  btn.classList.toggle('active', hasData && isVisible);
}

function updateAllTraceButtons() { for (let i = 0; i < 5; i++) updateTraceButton(i); }


// =============================
// File / copy / export
// =============================
function downloadFile(content, filename) {
  const blob = new Blob([content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

async function loadFile(file, slot = 0) {
  if (!file || slot < 0) return;
  const ext = file.name.split('.').pop().toLowerCase();
  const format = ['s1p', 's2p'].find(f => f === ext);
  if (!format) return;
  const buffer = await file.arrayBuffer();
  const text = new TextDecoder().decode(buffer);
  const parsed = vnaData.parseSnP(text);
  if (!parsed || !parsed.freqs || parsed.freqs.length === 0) return;

  vnaData.setSlotData(slot, parsed.freqs, parsed.S11, parsed.S21, parsed.S12, parsed.S22);
  if (slot == 0) graph.resetToRange(slot);
  graph.visibility[slot] = true;
  updateTraceButton(slot);
  graph.redraw(true);
  updateMarkerTable();
}

function loadTestData() {
  const frequencies = [], S11 = [], S21 = [];
  for (let i = 0; i < 10000; i++) {
    const freq = 1e6 + i * 6e6/100;
    frequencies.push(freq);
    const resonance = 100e6, q = 50, detuning = (freq - resonance) / resonance;
    const mag = 1 / Math.sqrt(1 + Math.pow(2 * q * detuning, 2));
    const phase = -Math.atan(2 * q * detuning);
    S11.push({ re: mag * Math.cos(phase), im: mag * Math.sin(phase) });
    const cutoff = 500e6, ratio = freq / cutoff;
    const mag21 = 1 / Math.sqrt(1 + Math.pow(ratio, 4));
    const phase21 = -Math.atan(Math.pow(ratio, 2));
    S21.push({ re: mag21 * Math.cos(phase21), im: mag21 * Math.sin(phase21) });
  }
  vnaData.setSlotData(0, frequencies, S11, S21);
  graph.resetView();
}

// Copy / Download
async function copyToClipboard() {
  const blob = await new Promise(r => vnaCanvas.toBlob(r, 'image/png'));
  await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
}

// =============================
// Markers
// =============================
function addMarker() { graph.addMarker(); }
function removeMarker() { graph.removeSelectedMarker(); }
function changeMarker() {
  const idx = graph.selectedMarkerIndex;
  if (idx < 0 || idx >= graph.markers.length) return;
  const tdFreq = markerTable.querySelectorAll('tr')[idx].cells[1];
  if (!tdFreq || tdFreq.querySelector('form')) return;
  const currentValue = tdFreq.textContent;
  tdFreq.innerHTML = `<form><input type="text" value="${currentValue}"></form>`;
  const form = tdFreq.querySelector('form');
  const input = form.querySelector('input');
  input.focus();
  input.setSelectionRange(0, currentValue.lastIndexOf(' '));
  form.addEventListener('submit', (e) => {e.preventDefault(); graph.setMarkerFreq(idx, getValue(input.value)); });
  input.addEventListener('blur', () => { tdFreq.textContent = currentValue; });
}

function updateMarkerTable() {
  markerTable.innerHTML = '';
  graph.markers.forEach((marker, idx) => {
    const tr = document.createElement('tr');
    if (idx === graph.selectedMarkerIndex) tr.classList.add('selected');
    tr.innerHTML = `<td style="width: 40px;">${idx + 1}</td><td>${formatFreqValue(marker.freq)}</td>`;
    tr.addEventListener('click', () => { graph.selectMarker(idx); });
    markerTable.appendChild(tr);
  });
}

// =============================
// Area panel creation and sync
// =============================
function buildAreaPanels() {
  areaPanels.innerHTML = '';
  graph.areas.forEach((area, areaIdx) => {
    if (!area.visible) return; 
    const panel = document.createElement('div');
    panel.className = 'area-panel';
    panel.area = areaIdx;
    // Позиционируем панель в верхней части region
    const r = area.region;
    panel.style.left = (r.leftPct * 100 + 1) + '%';
    panel.style.top = (r.topPct * 100) + '%';
    panel.style.width = ((r.rightPct - r.leftPct) * 100 - 2) + '%';

    // Dropdown TRACE_TYPES
    const sel = document.createElement('select');
    sel.innerHTML = '';
    for (const [type, def] of Object.entries(TRACE_TYPES)) {
      const opt = document.createElement('option');
      opt.value = type;
      opt.textContent = def.name + (def.suffix ? ` (${def.suffix})` : '');
      sel.appendChild(opt);
    }
    sel.value = area.trace.type;
    sel.addEventListener('change', () => { 
     area.setTraceType(sel.value);
     updateChannelCheckboxes(panel, area);
     updateSmithFormatDropdown(panel, area);
     graph.redraw(true);
    });
    panel.appendChild(sel);

    // Smith format select
    const smithSel = document.createElement('select');
    smithSel.className = 'smith-select';
    smithSel.addEventListener('change', () => {
      area.trace.smithFormat = smithSel.value;
      graph.redraw(true);
    });
    panel.appendChild(smithSel);

    // Channels checkboxes
    ['S11', 'S21', 'S12', 'S22'].forEach(ch => {
      const lbl = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.channel = ch;
      cb.addEventListener('change', () => {
        const chObj = {};
        panel.querySelectorAll('input[type=checkbox]').forEach(c => { chObj[c.channel] = c.checked; });
        area.setChannels(chObj);
        graph.redraw(true);
      });
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(ch));
      panel.appendChild(lbl);
    });

    // Кнопка сброса
    const btnReset = document.createElement('button');
    btnReset.textContent = '⟲';
    btnReset.title = 'Reset scale';
    btnReset.addEventListener('click', () => { area.resetView(graph.data); graph.redraw(true); });
    panel.appendChild(btnReset);

    // Кнопка автомасштаба (заглушка)
    const btnAuto = document.createElement('button');
    btnAuto.textContent = '⟳';
    btnAuto.title = 'Auto scale (soon)';
    btnAuto.disabled = true;
    panel.appendChild(btnAuto);
    areaPanels.appendChild(panel);
    updateChannelCheckboxes(panel, area);
    updateSmithFormatDropdown(panel, area);
  });
}

function updateChannelCheckboxes(panel, area) {
  const typeDef = TRACE_TYPES[area.trace.type];
  const mask = area.trace.channels;
  panel.querySelectorAll('input[type=checkbox]').forEach(cb => {
    const ch = cb.channel;
    const chBit = ch === 'S11' ? CH_S11 : ch === 'S21' ? CH_S21 : ch === 'S12' ? CH_S12 : CH_S22;
    cb.disabled = typeDef ? !(typeDef.valid & chBit) : false;
    cb.checked = !!(mask & chBit);
  });
}

function updateSmithFormatDropdown(panel, area) {
  const select = panel.querySelector('.smith-select');
  if (!select) return;
  const typeDef = TRACE_TYPES[area.trace.type];
  if (!typeDef || !typeDef.rad) { select.style.display = 'none'; return; }
  select.style.display = 'block';
  select.innerHTML = '';

  const currentChannels = area.trace.channels;
  let hasValidOption = false;
  for (const [key, info] of Object.entries(MARKER_INFO)) {
    if (info.valid & currentChannels) {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = info.name;
      if (key === area.trace.smithFormat) opt.selected = true;
      select.appendChild(opt);
      hasValidOption = true;
    }
  }

  if (!hasValidOption || !select.value) {
    const firstValid = Object.entries(MARKER_INFO).find(([k, info]) => info.valid & currentChannels);
    if (firstValid) {
      area.trace.smithFormat = firstValid[0];
      updateSmithFormatDropdown(panel, area);
    }
  }
}

// =============================
// Select areas on canvas configuration
// =============================
const LAYOUT_PRESETS = [
  { name: '1: ◻', regions: [[0, 0, 1, 1]] },
  { name: '2: ◫', regions: [[0, 0, 0.5, 1], [0.5, 0, 1, 1]] },
  { name: '2: ▤', regions: [[0, 0, 1, 0.5], [0, 0.5, 1, 1]] },
  { name: '3: ◰', regions: [[0, 0, 0.5, 1], [0.5, 0, 1, 0.5], [0.5, 0.5, 1, 1]] },
  { name: '3: ◳', regions: [[0, 0, 0.5, 0.5], [0, 0.5, 0.5, 1], [0.5, 0, 1, 1]] },
  { name: '3: ▤', regions: [[0, 0, 1, 0.333], [0, 0.333, 1, 0.666], [0, 0.666, 1, 1]] },
  { name: '4: ⊞', regions: [[0, 0, 0.5, 0.5], [0.5, 0, 1, 0.5], [0, 0.5, 0.5, 1], [0.5, 0.5, 1, 1]] }
];

function getRegions(id) {
  const preset = LAYOUT_PRESETS[id];
  if (!preset) return [];
  return preset.regions.map(r => ({ leftPct: r[0], topPct: r[1], rightPct: r[2], bottomPct: r[3] }));
}

function initLayouts() {
  layoutSelect.innerHTML = '';
  LAYOUT_PRESETS.forEach((layout, index) => {
    const opt = document.createElement('option');
    opt.value = index;
    opt.textContent = layout.name;
    layoutSelect.appendChild(opt);
  });
  const id = localStorage.getItem('vna-layout') || 0;
  layoutSelect.value = id;
  changeLayout(id);
}

function changeLayout(layoutId) {
  const regionsArray = getRegions(layoutId);
  if (!regionsArray) return;
  localStorage.setItem('vna-layout', layoutId);
  graph.setRegions(regionsArray);
  buildAreaPanels();
}

// =============================
//  Инициализация
// =============================
function main() {
  vnaData = new VNAData(5);
  graph = new VNAGraph('vnaCanvas', vnaData);

  // 2. UI
  initThemes();
  graph.updateColors()

  // 3. Данные и отрисовка
  initLayouts();
  loadTestData();
  graph.resetView();
  updateFreqInputs();
  updateAllTraceButtons();
  updateMarkerTable();

  // 4. События
  window.addEventListener('resize', () => {graph.resize();});
  fileInput.addEventListener('change', async e => {loadFile(e.target.files[0], e.target.slot);});

  // Drag & drop support
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', async e => {e.preventDefault(); loadFile(e.dataTransfer.files[0], 0);});
}

document.addEventListener('DOMContentLoaded', main);

</script>
